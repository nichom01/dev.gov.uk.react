# Bob pipeline definition for the GOV.UK React component library. This file IS the process.
#
# Issues are opened by the upstream watcher (scripts/upstream/check.mjs, run
# daily by .github/workflows/upstream-watch.yml) with the bob:start label, or
# by hand. Planning stages run automatically because upstream issues arrive
# with their acceptance criteria already written; a human reviews the draft
# PR and the "what changed" document at the end. To review every plan, set
# `gate: human` on hlp / llp / tests.
#
# - Each stage runs one Bob custom mode (see /.bob/custom_modes.yaml).
# - Labels are derived from stage ids:  bob:<id>-review, bob:<id>-approved
#   plus bob:start, bob:working, bob:revise, bob:failed, bob:done, bob:parked.
# - Paths for prompts and schemas are relative to this file.
# - Run `npm run validate` after editing.
#
# Bump `version` when you change the process. Issues already in flight record
# the version they started with (in state.json on their branch).

version: 1

repo:
  path: ../..            # the repo root, relative to this file
  base_branch: main
  remote: origin
  # owner / name are read from the remote URL; set them to override.

branch: bob/issue-{{issue}}
output_dir: docs/bob/{{issue}}
worktrees_dir: ~/.bob-pipeline/worktrees

poller:
  interval_seconds: 120
  concurrency: 2
  claim_settle_seconds: 3

# How Bob Shell is invoked. Placeholders: {{mode}} {{max_cost}} {{max_turns}}
# {{workspace}} {{task_id}}. Adjust if your Bob Shell version uses other
# flags (check `bob run --help`). BOB_API_KEY must be in the environment.
bob:
  bin: bob
  args:
    - run
    - --accept-license
    - --trust
    - --format
    - stream-json
    - --mode
    - "{{mode}}"
    - --max-cost
    - "{{max_cost}}"
    - --max-turns
    - "{{max_turns}}"
    - --workspace
    - "{{workspace}}"
  resume_args: [--resume, "{{task_id}}"]
  prompt_via: stdin

defaults:
  max_cost: 2
  max_turns: 40

stages:
  - id: hlp
    name: High-level plan
    description: Understand the issue and propose an approach, components and risks.
    mode: hlp-planner
    prompt: prompts/hlp.md
    inputs: [issue, feedback]
    outputs:
      - file: hlp.md
      - file: hlp.json
        schema: schemas/hlp.schema.json
    comment: hlp.md
    gate: auto
    view: plan

  # Phase 2: compare this plan with every other open issue's plan.
  - id: deps
    name: Dependency check
    description: Find ordering dependencies, overlapping work and conflicts with other open issues.
    mode: dep-checker
    prompt: prompts/deps.md
    inputs: [issue, hlp, all_open:hlp, feedback]
    outputs:
      - file: deps.md
      - file: deps.json
        schema: schemas/deps.schema.json
    comment: deps.md
    # The upstream watcher already records "blocked by" links for the issues
    # it opens (bump before components, dependencies before dependants). To
    # also record links found by this stage, set gate: human and restore:
    #   on_approve:
    #     - action: add_issue_dependencies
    #       with: { file: deps.json, min_confidence: high }
    gate: auto
    view: dependency-graph

  - id: llp
    name: Low-level plan
    description: File-by-file design, interfaces, data changes and test approach.
    mode: llp-planner
    prompt: prompts/llp.md
    inputs: [issue, hlp, deps, feedback]
    outputs:
      - file: llp.md
      - file: llp.json
        schema: schemas/llp.schema.json
    comment: llp.md
    gate: auto
    view: plan

  # Phase 3: top-down test plan (smoke -> BDD -> component -> unit), each test
  # traced to an acceptance criterion or risk, reviewed before any code is written.
  - id: tests
    name: Test plan
    description: Decide which tests to write at each layer, and why, before implementation.
    mode: test-planner
    prompt: prompts/tests.md
    inputs: [issue, hlp, llp, feedback]
    outputs:
      - file: tests.md
      - file: tests.json
        schema: schemas/tests.schema.json
    comment: tests.md
    post:
      # Logs acceptance criteria and risks with no test. Use mode: fail to block.
      - action: check_traceability
        with:
          plan: hlp.json
          tests: tests.json
          mode: warn
    gate: auto
    view: test-pyramid


  - id: implement
    name: Implement
    description: Make the code changes in the low-level plan and get tests passing.
    mode: implementer
    prompt: prompts/implement.md
    inputs: [issue, hlp, llp, tests, feedback]
    # Don't start coding while a "blocked by" issue is still open on GitHub.
    wait_for_blockers: true
    commit: all
    max_cost: 8
    max_turns: 120
    retries: 0
    pre:
      # Fresh worktree: install the library's dependencies first.
      - run: npm ci --no-audit --no-fund
        on_fail: fail
        timeout_seconds: 600
    post:
      # Typecheck + unit + conformance tests (every upstream fixture), then the library build.
      - run: npm run check && npm run build
        on_fail: retry_with_output
        timeout_seconds: 1200
      - action: open_draft_pr
    gate: auto
    view: diff

  - id: changes
    name: What changed
    description: Explain what changed and why, for reviewers and release notes.
    mode: change-writer
    prompt: prompts/changes.md
    inputs: [issue, hlp, llp, tests, diff, feedback]
    outputs:
      - file: changes.md
    comment: changes.md
    post:
      - action: update_pr_body
        with:
          file: changes.md
    gate: human
    view: plan
